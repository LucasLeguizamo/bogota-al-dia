name: Actualizar Datos

on:
  schedule:
    # Ejecutar cada lunes a las 6:00 UTC (1:00 AM hora Colombia)
    - cron: '0 6 * * 1'
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install

      - name: Extract data
        run: pnpm run extract

      # Si algún registro no cumple su schema, el job falla y no se commitea nada
      - name: Validate data
        run: pnpm validate

      - name: Check for changes
        id: check
        run: |
          # Idempotencia: los extractores conservan generado/ultima_actualizacion
          # cuando el contenido no cambia (scripts/stable-output.ts), así que
          # git diff solo detecta cambios reales en los datos
          if git diff --quiet data/; then
            echo "changed=false" >> $GITHUB_OUTPUT
            echo "✓ Sin cambios en los datos"
          else
            echo "changed=true" >> $GITHUB_OUTPUT
            echo "Cambios detectados:"
            git diff --stat data/
          fi

      - name: Commit and push
        if: steps.check.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          # Mensaje incluye resumen de cambios
          CHANGES=$(git diff --cached --stat data/ | tail -1)
          git commit -m "chore: actualizar datos $(date +%Y-%m-%d)

          $CHANGES"
          git push
          echo "✓ Datos actualizados y pusheados"

      - name: No changes
        if: steps.check.outputs.changed == 'false'
        run: echo "✓ Ejecución idempotente - sin cambios que commitear"
